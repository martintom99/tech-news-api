name: Daily Tech News Batch Job

on:
  schedule:
    # 每天 UTC 時間 22:00 執行 (等於台灣時間早上 6:00)
    - cron: '0 22 * * *'
  # 加上 workflow_dispatch 代表允許我們在 GitHub 網頁上手動點擊執行按鈕
  workflow_dispatch: 

jobs:
  run-batch:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 把你的程式碼抓下來
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 準備 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. 安裝我們需要的套件 (讀取 requirements.txt)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 執行爬蟲與翻譯腳本 (並把 GitHub Secrets 傳給程式)
      - name: Run batch script
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          #python batch_job.py
          exit 0
